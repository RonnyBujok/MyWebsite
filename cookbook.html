<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronny's Cookbook</title>
  <link rel="stylesheet" href="styles/cookbook.css">
  <link rel="stylesheet" href="styles/ui.css">
</head>
<body>
  <nav>
    <ul class="sidebar">
      <li class = "close-icon-button" onclick=hideSidebar()>
          <img src="icons/close.svg" alt="">
      </li>
      <li><a href="about.html">About</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="teaching.html">Teaching</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <ul class="menu-button-parent">
      <li><a href="index.html">
        <img style="padding-right: 10px;" src="icons/home.svg">
        Ronny Bujok
      </a></li>
      <li class="hideOnMobile"><a href="about.html">About</a></li>
      <li class="hideOnMobile"><a href="research.html">Research</a></li>
      <li class="hideOnMobile"><a href="teaching.html">Teaching</a></li>
      <li class="hideOnMobile"><a href="projects.html">Projects</a></li>
      <li class="hideOnMobile"><a href="contact.html">Contact</a></li>
      <li class="menu-button" onclick=showSidebar()>
        <img src="icons/menu.svg" alt="">
      </li>
    </ul>
  </nav>

  <section class="cb-hero" id="cb-hero">
    <div class="cb-hero-inner">
      <h1>Ronny's Cookbook</h1>
      <p class="cb-sub">A collection of my favorite recipes</p>
    </div>
    <svg class="cb-wave" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12C100 24 200 0 300 12S500 24 600 12S800 0 900 12S1100 24 1200 12V24H0Z"/></svg>
  </section>

  <header class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" class="search-input" placeholder="Search" aria-label="Search recipes">
      </label>
      <button type="button" id="recipes-btn" class="pill-btn">Recipes</button>
      <button type="button" id="filter-toggle" class="pill-btn">Filter<span id="filter-count"></span></button>
    </div>
  </header>

  <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="sheet-close" class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body">
        <ul id="recipe-dd" hidden></ul>
        <div id="filter-view" hidden>
          <div class="settings-bar"><button type="button" id="tag-settings-btn" class="settings-link" hidden>⚙ Tag settings</button></div>
          <div id="popular-block" hidden>
            <p class="tag-heading">Most used</p>
            <div class="tags-container popular-tags"></div>
          </div>
          <p class="tag-heading" id="all-heading" hidden>All tags</p>
          <div class="tags-container all-tags"></div>
        </div>
        <div id="settings-view" hidden></div>
      </div>
      <div class="sheet-foot" id="settings-foot" hidden>
        <button type="button" id="settings-done" class="done-btn">Done</button>
      </div>
      <div class="sheet-foot" id="filter-foot" hidden>
        <button type="button" class="reset-filters" id="panel-reset" hidden>Reset</button>
        <button type="button" id="sheet-done" class="done-btn">Show recipes</button>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="layout">
      <aside class="index"><div class="panel-title">Recipes</div><ul id="recipe-list"></ul></aside>
      <main class="recipe-page" aria-live="polite"></main>
    </div>
  </div>

  <button type="button" id="to-top" class="to-top" aria-label="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
  <a href="recipeform.html" id="add-recipe-btn" title="Add recipe" aria-label="Add recipe"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>

  <footer class = footer>
      <div>© 2026 Ronny Bujok</div>
      <div style="margin-top:8px;">
          Licensed under 
          <a class="hyperlink" href="https://creativecommons.org/licenses/by/4.0/deed.en">
              CC BY 4.0
          </a>
      </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://oqzceuesqnkmdbsgttcl.supabase.co",
  "sb_publishable_gQkpZldPR96EZ2JHwSan5Q_rmjX2WMN"
);
const $ = s => document.querySelector(s);
let allRecipes = [], selectedTags = [], searchTerm = '';
// tag settings (favorites + groups), saved in Supabase table cookbook_settings and readable by everyone
let settings = { favorites: [], groups: [] };
let rawTags = new Map();   // lowercase tag -> { name, n }
let items = [], itemMap = new Map(); // what the filter shows: single tags and groups

// ---------- helpers ----------
const slug = n => n.replace(/\s+/g, '-').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse = (v, d) => { try { return typeof v === 'string' ? JSON.parse(v) : (v ?? d); } catch { return d; } };
const fmt = n => String(+n.toFixed(2));

// ---------- tag settings ----------
const normSettings = d => ({
  favorites: Array.isArray(d?.favorites) ? d.favorites.map(String) : [],
  groups: Array.isArray(d?.groups) ? d.groups.filter(g => g && g.id && Array.isArray(g.members))
    .map(g => ({ id: String(g.id), name: String(g.name || '').trim(), members: g.members.map(m => String(m).toLowerCase()) })) : []
});
async function loadSettings() {
  const { data } = await supabaseClient.from('cookbook_settings').select('data').eq('id', 'tags').maybeSingle();
  settings = normSettings(data?.data);
}

// ---------- load ----------
async function loadRecipes() {
  const page = $('.recipe-page');
  page.innerHTML = '<p class="empty">Loading recipes…</p>';
  const { data, error } = await supabaseClient.from('recipes').select('*').order('id');
  if (error) { page.innerHTML = `<p class="empty">Could not load recipes: ${esc(error.message)}</p>`; return; }

  allRecipes = data.map(r => {
    const seen = new Set(); // saved tags + ingredient names, one entry per name
    const tags = [...parse(r.tags, []), ...parse(r.ingredients, []).map(i => i && i.name)]
      .map(t => String(t ?? '').trim()).filter(t => t && !seen.has(t.toLowerCase()) && seen.add(t.toLowerCase()));
    return {
      name: r.name || 'Unnamed', baseServings: r.baseServings || 4, image: r.image || '',
      tags, tagKeys: tags.map(t => t.toLowerCase()),
      ingredients: parse(r.ingredients, []), instructions: parse(r.instructions, []), credits: parse(r.credits, {})
    };
  }).sort((a, b) => a.name.localeCompare(b.name));

  await loadSettings();
  renderNav();
  render();
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

// ---------- render ----------
function buildItems() {
  const inGroup = new Set();
  settings.groups.forEach(g => g.members.forEach(m => inGroup.add(m)));
  items = [];
  settings.groups.forEach(g => {
    const keys = g.members.filter(m => rawTags.has(m));
    if (!keys.length) return;
    items.push({ key: 'g:' + g.id, label: g.name || rawTags.get(keys[0]).name, keys, group: true,
      n: allRecipes.filter(r => keys.some(k => r.tagKeys.includes(k))).length });
  });
  rawTags.forEach((e, k) => { if (!inGroup.has(k)) items.push({ key: k, label: e.name, keys: [k], n: e.n }); });
  items.sort((a, b) => a.label.localeCompare(b.label));
  itemMap = new Map(items.map(i => [i.key, i]));
}

function renderNav() {
  $('#recipe-list').innerHTML = $('#recipe-dd').innerHTML =
    allRecipes.map(r => `<li><a href="#${esc(slug(r.name))}">${esc(r.name)}</a></li>`).join('');

  // count how many recipes use each tag (one entry per tag, case-insensitive)
  rawTags = new Map();
  allRecipes.forEach(r => r.tags.forEach(t => {
    const k = t.toLowerCase(), e = rawTags.get(k) || { name: t, n: 0 };
    e.n++; rawTags.set(k, e);
  }));
  buildItems();
  selectedTags = selectedTags.filter(k => itemMap.has(k));

  const pill = e => `<button type="button" class="recipe-tag${e.group ? ' group' : ''}" data-tag="${esc(e.key)}"${e.group ? ` title="${esc(e.keys.map(k => rawTags.get(k).name).join(', '))}"` : ''}>${esc(e.label)}</button>`;
  const favs = settings.favorites.map(k => itemMap.get(k)).filter(Boolean).sort((a, b) => a.label.localeCompare(b.label));
  const popular = items.filter(e => e.n > 1).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label)).slice(0, 20);
  // your favorites come first; until you pick some, the most used tags are shown instead
  const useFav = favs.length > 0;
  const showTop = useFav || (popular.length >= 3 && items.length > popular.length);
  $('#popular-block').hidden = $('#all-heading').hidden = !showTop;
  $('#popular-block .tag-heading').textContent = useFav ? '★ Favorites' : 'Most used';
  $('.popular-tags').innerHTML = showTop ? (useFav ? favs : popular).map(pill).join('') : '';
  $('.all-tags').innerHTML = items.map(pill).join('');
}

function recipeHTML(r) {
  const opts = Array.from({ length: Math.max(12, r.baseServings) }, (_, i) =>
    `<option${i + 1 === r.baseServings ? ' selected' : ''}>${i + 1}</option>`).join('');
  const ings = r.ingredients.map(i => {
    const a = Number(i.amount) || 0, u = i.unit || '';
    return `<li data-base="${a}" data-unit="${esc(u)}"><span class="amt">${a > 0 ? esc(`${fmt(a)} ${u}`.trim()) : ''}</span><span>${esc(i.name)}</span></li>`;
  }).join('');
  const steps = r.instructions.map(s => `<li><span>${esc(s)}</span></li>`).join('');
  const c = r.credits || {};
  const credit = !c.author ? '' : /^https?:\/\//i.test(c.link || '')
    ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.author)}</a>` : esc(c.author);

  return `<article class="recipe" id="${esc(slug(r.name))}" data-base="${r.baseServings}">
    <p class="kicker">${r.tags.slice(0, 3).map(t => `<span class="kick">${esc(t)}</span>`).join('')}</p>
    <h2>${esc(r.name)}</h2>
    <div class="recipe-body">
      <div class="side">
        ${r.image ? `<figure class="recipe-image"><img src="${esc(r.image)}" alt="${esc(r.name)}" loading="lazy" decoding="async"></figure>` : ''}
        <section>
          <div class="section-head"><h3><button type="button" class="ing-toggle" aria-expanded="true">Ingredients<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h3><label class="servings">Servings<select>${opts}</select></label></div>
          <ul class="ingredients-list">${ings}</ul>
        </section>
      </div>
      <section>
        <h3>Method</h3>
        <ol class="steps">${steps}</ol>
        ${credit ? `<p class="credit">Source: ${credit}</p>` : ''}
      </section>
    </div>
  </article>`;
}

function visibleRecipes() {
  const sel = selectedTags.map(k => itemMap.get(k)).filter(Boolean);
  const has = (r, it) => it.keys.some(k => r.tagKeys.includes(k));
  return allRecipes.filter(r =>
    sel.every(it => has(r, it)) &&
    (!searchTerm || r.name.toLowerCase().includes(searchTerm) || r.tagKeys.some(t => t.includes(searchTerm)) ||
      items.some(it => it.group && it.label.toLowerCase().includes(searchTerm) && has(r, it))));
}

function render() {
  const list = visibleRecipes();
  $('.recipe-page').innerHTML = list.length ? list.map(recipeHTML).join('')
    : '<div class="empty"><p>No recipes match your filters.</p><button type="button" class="reset-filters">Reset filters</button></div>';
  document.querySelectorAll('.recipe-tag').forEach(t => t.classList.toggle('active', selectedTags.includes(t.dataset.tag)));
  $('#filter-count').textContent = selectedTags.length ? ` · ${selectedTags.length}` : '';
  $('#filter-toggle').classList.toggle('on', selectedTags.length > 0);
  $('#panel-reset').hidden = !selectedTags.length && !searchTerm;
  $('#sheet-done').textContent = `Show ${list.length} recipe${list.length === 1 ? '' : 's'}`;
}

function resetFilters() {
  selectedTags = []; searchTerm = '';
  $('.search-input').value = '';
  render();
}

// ---------- full-screen sheets (Recipes / Filter) ----------
const overlay = $('#overlay');
function openSheet(view) {
  $('#sheet-title').textContent = view === 'recipes' ? 'Recipes' : view === 'settings' ? 'Tag settings' : 'Filter';
  $('#recipe-dd').hidden = view !== 'recipes';
  $('#filter-view').hidden = $('#filter-foot').hidden = view !== 'filter';
  $('#settings-view').hidden = $('#settings-foot').hidden = view !== 'settings';
  if (view === 'settings') renderSettings();
  overlay.hidden = false;
  document.body.classList.add('lock');
  $('#sheet-close').focus();
}
function closeSheet() { overlay.hidden = true; document.body.classList.remove('lock'); }

// ---------- search bar: hides while scrolling down, returns on scroll up ----------
const toolbar = $('#toolbar');
let lastY = scrollY, jumping = false;
addEventListener('scroll', () => {
  const y = scrollY, d = y - lastY;
  if (jumping) { toolbar.classList.add('hide'); lastY = y; return; }
  if (Math.abs(d) < 6) return;
  toolbar.classList.toggle('hide', d > 0 && y > 80);
  lastY = y;
}, { passive: true });

// ---------- back to top ----------
const toTop = $('#to-top');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > innerHeight * 1.2), { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

// ---------- tag settings: favorites and groups (only for the signed-in owner; the database enforces it too) ----------
let isOwner = false, setTab = 'fav', setQuery = '', memberQuery = '', editing = null;
const gid = () => Math.random().toString(36).slice(2, 10);
function setOwner(v) {
  isOwner = !!v;
  $('#tag-settings-btn').hidden = !isOwner;
  if (!isOwner && !$('#settings-view').hidden) { closeSheet(); }
}
supabaseClient.auth.getSession().then(({ data }) => setOwner(data.session));
supabaseClient.auth.onAuthStateChange((_e, session) => setOwner(session));

async function persistSettings() {
  const { error } = await supabaseClient.from('cookbook_settings').upsert({ id: 'tags', data: settings, updated_at: new Date().toISOString() });
  const msg = $('#set-msg');
  if (msg) msg.textContent = error ? 'Could not save: ' + error.message : '';
  return !error;
}
async function settingsChanged() { // save, then refresh the filter and the settings view
  await persistSettings();
  renderNav(); render(); renderSettings();
}
const favTags = () => {
  const q = setQuery.toLowerCase(), list = items.filter(i => !q || i.label.toLowerCase().includes(q));
  return list.map(i => { const on = settings.favorites.includes(i.key);
    return `<button type="button" class="set-tag${on ? ' on' : ''}" data-fav="${esc(i.key)}">${on ? '★ ' : ''}${esc(i.label)}${i.group ? ' <small>group</small>' : ''}</button>`; }).join('')
    || '<p class="set-hint">No tags match.</p>';
};
const memberTags = () => {
  const q = memberQuery.toLowerCase();
  return [...rawTags.entries()].sort((a, b) => a[1].name.localeCompare(b[1].name)).filter(([k, e]) => !q || e.name.toLowerCase().includes(q))
    .map(([k, e]) => {
      const other = settings.groups.find(g => g.id !== editing.id && g.members.includes(k));
      const on = editing.members.includes(k);
      return `<button type="button" class="set-tag${on ? ' on' : ''}${other ? ' taken' : ''}" data-m="${esc(k)}" ${other ? `disabled title="Already in the group ${esc(other.name)}"` : ''}>${on ? '✓ ' : ''}${esc(e.name)}</button>`;
    }).join('') || '<p class="set-hint">No tags match.</p>';
};
function renderSettings() {
  const tabs = `<div class="set-seg" role="tablist"><button type="button" data-st="fav" class="${setTab === 'fav' ? 'on' : ''}">Favorites</button><button type="button" data-st="groups" class="${setTab === 'groups' ? 'on' : ''}">Groups</button></div>`;
  let body = '';
  if (setTab === 'fav') {
    body = `<p class="set-hint">Tap a tag to make it a favorite. Favorites are shown first in the filter.</p>
      <input class="set-input" id="set-q" type="search" placeholder="Find a tag…" value="${esc(setQuery)}" aria-label="Find a tag">
      <div class="tags-container set-tags" id="set-tags">${favTags()}</div>`;
  } else if (editing) {
    body = `<label class="set-label" for="g-name">Group name</label>
      <input class="set-input" id="g-name" value="${esc(editing.name)}" placeholder="e.g. Tomato" maxlength="40">
      <p class="set-label">Tags in this group <span class="set-count" id="g-count">${editing.members.length} selected</span></p>
      <input class="set-input" id="g-q" type="search" placeholder="Find a tag…" value="${esc(memberQuery)}" aria-label="Find a tag">
      <div class="tags-container set-tags" id="g-tags">${memberTags()}</div>
      <div class="set-actions"><button type="button" class="set-btn" id="g-cancel">Cancel</button><button type="button" class="set-btn primary" id="g-save">Save group</button></div>`;
  } else {
    body = `<p class="set-hint">Group tags that mean the same, like tomato and tomatoes or Asian and asian. The filter then shows one tag for the whole group, and it finds recipes with any of them.</p>
      ${settings.groups.map(g => `<div class="group-row"><div class="group-main"><b>${esc(g.name || '(no name)')}</b><span>${esc(g.members.map(m => rawTags.get(m)?.name || m).join(', '))}</span></div>
        <button type="button" class="set-btn" data-edit="${esc(g.id)}">Edit</button><button type="button" class="set-btn danger" data-del="${esc(g.id)}">Delete</button></div>`).join('')}
      <button type="button" class="set-btn primary" id="new-group">+ New group</button>`;
  }
  $('#settings-view').innerHTML = tabs + body + '<p class="set-msg" id="set-msg" role="status"></p>';
}
$('#settings-view').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.st) { setTab = b.dataset.st; editing = null; renderSettings(); }
  else if (b.dataset.fav) {
    const k = b.dataset.fav;
    settings.favorites = settings.favorites.includes(k) ? settings.favorites.filter(f => f !== k) : [...settings.favorites, k];
    await settingsChanged();
  } else if (b.id === 'new-group') { editing = { id: gid(), name: '', members: [], isNew: true }; memberQuery = ''; renderSettings(); }
  else if (b.dataset.edit) { const g = settings.groups.find(x => x.id === b.dataset.edit); editing = { ...g, members: [...g.members] }; memberQuery = ''; renderSettings(); }
  else if (b.dataset.del) {
    if (b.dataset.armed) {
      settings.groups = settings.groups.filter(g => g.id !== b.dataset.del);
      settings.favorites = settings.favorites.filter(f => f !== 'g:' + b.dataset.del);
      await settingsChanged();
    } else { b.dataset.armed = '1'; b.textContent = 'Tap again to delete'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Delete'; } }, 3000); }
  } else if (b.dataset.m) {
    const k = b.dataset.m;
    editing.members = editing.members.includes(k) ? editing.members.filter(m => m !== k) : [...editing.members, k];
    $('#g-tags').innerHTML = memberTags(); $('#g-count').textContent = editing.members.length + ' selected';
  } else if (b.id === 'g-cancel') { editing = null; renderSettings(); }
  else if (b.id === 'g-save') {
    if (!editing.members.length) { $('#set-msg').textContent = 'Select at least one tag.'; return; }
    const name = editing.name.trim() || rawTags.get(editing.members[0])?.name || 'Group';
    const g = { id: editing.id, name, members: editing.members };
    settings.groups = editing.isNew ? [...settings.groups, g] : settings.groups.map(x => x.id === g.id ? g : x);
    // a favorite that just became part of a group stays a favorite, as the group
    settings.favorites = [...new Set(settings.favorites.map(f => g.members.includes(f) ? 'g:' + g.id : f))];
    editing = null; await settingsChanged();
  }
});
$('#settings-view').addEventListener('input', e => {
  if (e.target.id === 'set-q') { setQuery = e.target.value; $('#set-tags').innerHTML = favTags(); }
  else if (e.target.id === 'g-q') { memberQuery = e.target.value; $('#g-tags').innerHTML = memberTags(); }
  else if (e.target.id === 'g-name') editing.name = e.target.value;
});
$('#tag-settings-btn').addEventListener('click', () => { setTab = 'fav'; editing = null; setQuery = ''; openSheet('settings'); });
$('#settings-done').addEventListener('click', () => { editing = null; openSheet('filter'); });

// ---------- events ----------
$('.search-input').addEventListener('input', e => { searchTerm = e.target.value.trim().toLowerCase(); render(); });
$('#recipes-btn').addEventListener('click', () => openSheet('recipes'));
$('#filter-toggle').addEventListener('click', () => openSheet('filter'));
$('#sheet-close').addEventListener('click', closeSheet);
$('#sheet-done').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('click', e => {
  if (e.target === overlay) return closeSheet(); // click on the dimmed backdrop (desktop)

  const tag = e.target.closest('.recipe-tag');
  if (tag) {
    const k = tag.dataset.tag;
    selectedTags = selectedTags.includes(k) ? selectedTags.filter(t => t !== k) : [...selectedTags, k];
    render();
  } else if (e.target.closest('.ing-toggle')) {
    const btn = e.target.closest('.ing-toggle');
    btn.setAttribute('aria-expanded', !btn.closest('section').classList.toggle('collapsed'));
  } else if (e.target.closest('.reset-filters')) {
    resetFilters();
  } else if (e.target.closest('#recipe-list a, #recipe-dd a')) {
    if (selectedTags.length || searchTerm) resetFilters(); // make sure the target recipe is on the page
    closeSheet();
    jumping = true; setTimeout(() => jumping = false, 1200); // keep the bar hidden during the jump
  }
});

// servings scaling
$('.recipe-page').addEventListener('change', e => {
  if (!e.target.matches('.servings select')) return;
  const art = e.target.closest('.recipe'), k = e.target.value / art.dataset.base;
  art.querySelectorAll('.ingredients-list li').forEach(li => {
    const a = li.dataset.base * k;
    li.querySelector('.amt').textContent = a > 0 ? `${fmt(a)} ${li.dataset.unit}`.trim() : '';
  });
});

loadRecipes();
</script>

<script>
  const sidebar = document.querySelector('.sidebar');
  function showSidebar() { sidebar.classList.add('show'); document.body.classList.add('menu-open'); }
  function hideSidebar() { sidebar.classList.remove('show'); document.body.classList.remove('menu-open'); }
  document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && !e.target.closest('.menu-button')) hideSidebar();
  });
</script>
</body>
</html>
