<body>

    <ul class="menu-button-parent">
      <li><a href="index.html">

      <li class="hideOnMobile"><a href="research.html">Research</a></li>
      <li class="hideOnMobile"><a href="teaching.html">Teaching</a></li>

  <section class="cb-hero" id="cb-hero">
    <div class="cb-hero-inner">
      <h1>Ronny's Cookbook</h1>
      <p class="cb-sub">A collection of my favorite recipes</p>
    </div>
    <svg class="cb-wave" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12C100 24 200 0 300 12S500 24 600 12S800 0 900 12S1100 24 1200 12V24H0Z"/></svg>
  </section>

  <header class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" class="search-input" placeholder="Search" aria-label="Search recipes">
      </label>
      <button type="button" id="recipes-btn" class="pill-btn">Recipes</button>
      <button type="button" id="filter-toggle" class="pill-btn">Filter<span id="filter-count"></span></button>
    </div>
  </header>

  <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="sheet-close" class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body">
        <ul id="recipe-dd" hidden></ul>
        <div id="filter-view" hidden><div class="tags-container"></div></div>
      </div>
      <div class="sheet-foot" id="filter-foot" hidden>
        <button type="button" class="reset-filters" id="panel-reset" hidden>Reset</button>
        <button type="button" id="sheet-done" class="done-btn">Show recipes</button>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="layout">
      <aside class="index"><div class="panel-title">Recipes</div><ul id="recipe-list"></ul></aside>
      <main class="recipe-page" aria-live="polite"></main>
    </div>
  </div>

  <button type="button" id="to-top" class="to-top" aria-label="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
  <a href="recipeform.html" id="add-recipe-btn" title="Add recipe" aria-label="Add recipe"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://oqzceuesqnkmdbsgttcl.supabase.co",
  "sb_publishable_gQkpZldPR96EZ2JHwSan5Q_rmjX2WMN"
);
const $ = s => document.querySelector(s);
let allRecipes = [], selectedTags = [], searchTerm = '';

// ---------- helpers ----------
const slug = n => n.replace(/\s+/g, '-').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse = (v, d) => { try { return typeof v === 'string' ? JSON.parse(v) : (v ?? d); } catch { return d; } };
const fmt = n => String(+n.toFixed(2));

// ---------- load ----------
async function loadRecipes() {
  const page = $('.recipe-page');
  page.innerHTML = '<p class="empty">Loading recipes…</p>';
  const { data, error } = await supabaseClient.from('recipes').select('*').order('id');
  if (error) { page.innerHTML = `<p class="empty">Could not load recipes: ${esc(error.message)}</p>`; return; }

  allRecipes = data.map(r => {
    const seen = new Set(); // saved tags + ingredient names, one entry per name
    const tags = [...parse(r.tags, []), ...parse(r.ingredients, []).map(i => i && i.name)]
      .map(t => String(t ?? '').trim()).filter(t => t && !seen.has(t.toLowerCase()) && seen.add(t.toLowerCase()));
    return {
      name: r.name || 'Unnamed', baseServings: r.baseServings || 4, image: r.image || '',
      tags, tagKeys: tags.map(t => t.toLowerCase()),
      ingredients: parse(r.ingredients, []), instructions: parse(r.instructions, []), credits: parse(r.credits, {})
    };
  }).sort((a, b) => a.name.localeCompare(b.name));

  renderNav();
  render();
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

// ---------- render ----------
function renderNav() {
  $('#recipe-list').innerHTML = $('#recipe-dd').innerHTML =
    allRecipes.map(r => `<li><a href="#${esc(slug(r.name))}">${esc(r.name)}</a></li>`).join('');

  const tags = new Map(); // one entry per tag, case-insensitive
  allRecipes.forEach(r => r.tags.forEach(t => tags.has(t.toLowerCase()) || tags.set(t.toLowerCase(), t)));
  $('.tags-container').innerHTML = [...tags.values()].sort((a, b) => a.localeCompare(b))
    .map(t => `<button type="button" class="recipe-tag" data-tag="${esc(t.toLowerCase())}">${esc(t)}</button>`).join('');
}

function recipeHTML(r) {
  const opts = Array.from({ length: Math.max(12, r.baseServings) }, (_, i) =>
    `<option${i + 1 === r.baseServings ? ' selected' : ''}>${i + 1}</option>`).join('');
  const ings = r.ingredients.map(i => {
    const a = Number(i.amount) || 0, u = i.unit || '';
    return `<li data-base="${a}" data-unit="${esc(u)}"><span class="amt">${a > 0 ? esc(`${fmt(a)} ${u}`.trim()) : ''}</span><span>${esc(i.name)}</span></li>`;
  }).join('');
  const steps = r.instructions.map(s => `<li><span>${esc(s)}</span></li>`).join('');
  const c = r.credits || {};
  const credit = !c.author ? '' : /^https?:\/\//i.test(c.link || '')
    ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.author)}</a>` : esc(c.author);

  return `<article class="recipe" id="${esc(slug(r.name))}" data-base="${r.baseServings}">
    <p class="kicker">${r.tags.slice(0, 3).map(t => `<span class="kick">${esc(t)}</span>`).join('')}</p>
    <h2>${esc(r.name)}</h2>
    <div class="recipe-body">
      <div class="side">
        ${r.image ? `<figure class="recipe-image"><img src="${esc(r.image)}" alt="${esc(r.name)}" loading="lazy" decoding="async"></figure>` : ''}
        <section>
          <div class="section-head"><h3><button type="button" class="ing-toggle" aria-expanded="true">Ingredients<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h3><label class="servings">Servings<select>${opts}</select></label></div>
          <ul class="ingredients-list">${ings}</ul>
        </section>
      </div>
      <section>
        <h3>Method</h3>
        <ol class="steps">${steps}</ol>
        ${credit ? `<p class="credit">Source: ${credit}</p>` : ''}
      </section>
    </div>
  </article>`;
}

function visibleRecipes() {
  return allRecipes.filter(r =>
    selectedTags.every(t => r.tagKeys.includes(t)) &&
    (!searchTerm || r.name.toLowerCase().includes(searchTerm) || r.tagKeys.some(t => t.includes(searchTerm))));
}

function render() {
  const list = visibleRecipes();
  $('.recipe-page').innerHTML = list.length ? list.map(recipeHTML).join('')
    : '<div class="empty"><p>No recipes match your filters.</p><button type="button" class="reset-filters">Reset filters</button></div>';
  document.querySelectorAll('.recipe-tag').forEach(t => t.classList.toggle('active', selectedTags.includes(t.dataset.tag)));
  $('#filter-count').textContent = selectedTags.length ? ` · ${selectedTags.length}` : '';
  $('#filter-toggle').classList.toggle('on', selectedTags.length > 0);
  $('#panel-reset').hidden = !selectedTags.length && !searchTerm;
  $('#sheet-done').textContent = `Show ${list.length} recipe${list.length === 1 ? '' : 's'}`;
  markRest();
}

function resetFilters() {
  selectedTags = []; searchTerm = '';
  $('.search-input').value = '';
  render();
}

// ---------- full-screen sheets (Recipes / Filter) ----------
const overlay = $('#overlay');
function openSheet(view) {
  $('#sheet-title').textContent = view === 'recipes' ? 'Recipes' : 'Filter';
  $('#recipe-dd').hidden = view !== 'recipes';
  $('#filter-view').hidden = $('#filter-foot').hidden = view !== 'filter';
  overlay.hidden = false;
  document.body.classList.add('lock');
  $('#sheet-close').focus();
}
function closeSheet() { overlay.hidden = true; document.body.classList.remove('lock'); }

// ---------- search bar: hides while scrolling down, returns on scroll up ----------
const toolbar = $('#toolbar');
let lastY = scrollY, jumping = false;
addEventListener('scroll', () => {
  const y = scrollY, d = y - lastY;
  if (jumping) { toolbar.classList.add('hide'); lastY = y; return; }
  if (Math.abs(d) < 6) return;
  toolbar.classList.toggle('hide', d > 0 && y > 80);
  lastY = y;
}, { passive: true });

// ---------- snap to the start of a recipe ----------
// Free scrolling inside a recipe. Once a scroll carries you into a different recipe
// (up or down), it settles at the START of that recipe. Tiny nudges spring back.
const snapOffset = () => parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 72;
let rest = { y: 0, idx: -1 }, endTimer, snapping = false;

function recipeIndexAt() { // recipe under the snap line; -1 while still above the first recipe
  const line = snapOffset() + 1;
  let idx = -1;
  document.querySelectorAll('.recipe').forEach((el, i) => { if (el.getBoundingClientRect().top <= line) idx = i; });
  return idx;
}
function markRest() { rest = { y: scrollY, idx: recipeIndexAt() }; }

function snapToRecipe(i) {
  const el = document.querySelectorAll('.recipe')[i];
  if (!el) return markRest();
  const top = el.getBoundingClientRect().top + scrollY - snapOffset();
  if (Math.abs(top - scrollY) < 2) return markRest();
  snapping = true; jumping = true; // keep the search bar tucked away during the move
  scrollTo({ top, behavior: 'smooth' });
  setTimeout(() => { if (snapping) { snapping = false; jumping = false; markRest(); } }, 1500);
}

addEventListener('scroll', () => {
  clearTimeout(endTimer);
  if (snapping) {
    endTimer = setTimeout(() => { snapping = false; jumping = false; markRest(); }, 160);
    return;
  }
  endTimer = setTimeout(() => {
    const idx = recipeIndexAt();
    if (idx < 0 || idx === rest.idx) return markRest();
    const nudge = Math.abs(scrollY - rest.y) < 120;
    if (nudge && rest.idx < 0) return markRest();
    snapToRecipe(nudge ? rest.idx : idx);
  }, 140);
}, { passive: true });

// ---------- back to top ----------
const toTop = $('#to-top');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > innerHeight * 1.2), { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

// ---------- events ----------
$('.search-input').addEventListener('input', e => { searchTerm = e.target.value.trim().toLowerCase(); render(); });
$('#recipes-btn').addEventListener('click', () => openSheet('recipes'));
$('#filter-toggle').addEventListener('click', () => openSheet('filter'));
$('#sheet-close').addEventListener('click', closeSheet);
$('#sheet-done').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('click', e => {
  if (e.target === overlay) return closeSheet(); // click on the dimmed backdrop (desktop)

  const tag = e.target.closest('.recipe-tag');
  if (tag) {
    const k = tag.dataset.tag;
    selectedTags = selectedTags.includes(k) ? selectedTags.filter(t => t !== k) : [...selectedTags, k];
    render();
  } else if (e.target.closest('.ing-toggle')) {
    const btn = e.target.closest('.ing-toggle');
    btn.setAttribute('aria-expanded', !btn.closest('section').classList.toggle('collapsed'));
  } else if (e.target.closest('.reset-filters')) {
    resetFilters();
  } else if (e.target.closest('#recipe-list a, #recipe-dd a')) {
    if (selectedTags.length || searchTerm) resetFilters(); // make sure the target recipe is on the page
    closeSheet();
    jumping = true; setTimeout(() => jumping = false, 1200); // keep the bar hidden during the jump
  }
});

// servings scaling
$('.recipe-page').addEventListener('change', e => {
  if (!e.target.matches('.servings select')) return;
  const art = e.target.closest('.recipe'), k = e.target.value / art.dataset.base;
  art.querySelectorAll('.ingredients-list li').forEach(li => {
    const a = li.dataset.base * k;
    li.querySelector('.amt').textContent = a > 0 ? `${fmt(a)} ${li.dataset.unit}`.trim() : '';
  });
});

loadRecipes();
</script>

<script>
  const sidebar = document.querySelector('.sidebar');
  function showSidebar() { sidebar.classList.add('show'); document.body.classList.add('menu-open'); }
  function hideSidebar() { sidebar.classList.remove('show'); document.body.classList.remove('menu-open'); }
  document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && !e.target.closest('.menu-button')) hideSidebar();
  });
</script>
</body>
</html>
